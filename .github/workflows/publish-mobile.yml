name: Publish PdDroidParty package
on:
  push:
    branches: [main]
    paths:
      - 'phone_audio_test/**'
      - 'rule30_feedback/**'
      - 'feedback_reverb/**'
      - 'rule30_phase_feedback/**'
      - '.github/workflows/publish-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PdDroidParty archive
        run: |
          mkdir -p dist/PhoneAudioTest
          cp phone_audio_test/droidparty_main.pd dist/PhoneAudioTest/
          cd dist
          zip -r ../PhoneAudioTest.pdz PhoneAudioTest
      - name: Build Rule 30 feedback archive
        run: |
          mkdir -p dist/Rule30Feedback
          cp rule30_feedback/droidparty_main.pd dist/Rule30Feedback/
          cd dist
          zip -r ../Rule30Feedback.pdz Rule30Feedback
      - name: Build feedback reverb archive
        run: |
          mkdir -p dist/FeedbackReverb
          cp feedback_reverb/droidparty_main.pd dist/FeedbackReverb/
          cd dist
          zip -r ../FeedbackReverb.pdz FeedbackReverb
      - name: Build Rule 30 phase feedback archive
        run: |
          mkdir -p dist/Rule30PhaseFeedback
          cp rule30_phase_feedback/droidparty_main.pd dist/Rule30PhaseFeedback/
          cd dist
          zip -r ../Rule30PhaseFeedback.pdz Rule30PhaseFeedback
      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view mobile-patches >/dev/null 2>&1; then
            gh release upload mobile-patches PhoneAudioTest.pdz Rule30Feedback.pdz FeedbackReverb.pdz Rule30PhaseFeedback.pdz --clobber
          else
            gh release create mobile-patches PhoneAudioTest.pdz Rule30Feedback.pdz FeedbackReverb.pdz Rule30PhaseFeedback.pdz --title "PdDroidParty mobile patches" --notes "Install these PdDroidParty .pdz packages using the app's Edit links catalogue."
          fi
